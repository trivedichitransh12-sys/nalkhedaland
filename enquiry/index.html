<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1C140D">

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=AW-1015216036"></script>

<title>पूछताछ करें — नलखेड़ा ज़मीन</title>
<meta name="description" content="नलखेड़ा (आगर मालवा) की 4.47 एकड़ ज़मीन के लिए अपना नाम और नंबर भेजें — मालिक खुद संपर्क करेंगे।">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --soil:#1C140D;
  --soil-60:rgba(28,20,13,.6);
  --soil-40:rgba(28,20,13,.4);
  --husk:#F2EDE2;
  --husk-deep:#E6DECC;
  --gram:#B07A1E;
  --gram-2:#D89B2E;
  --gold:#F2C56B;
  --soy:#4B6B39;
  --wa:#25D366;
  --line:rgba(28,20,13,.1);
  --hi:"Hind","Noto Sans Devanagari",system-ui,sans-serif;
  --display:"Poppins","Hind",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--soil);font-family:var(--hi);font-size:15.5px;line-height:1.55;
  background:linear-gradient(180deg,#1C140D 0%,#372614 55%,#54391F 100%) fixed,#1C140D;
  min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;
  padding:0 14px calc(24px + env(safe-area-inset-bottom))}
a{color:inherit}
svg{display:block}
:focus-visible{outline:3px solid var(--gram-2);outline-offset:2px}

.bar{width:100%;max-width:520px;display:flex;justify-content:space-between;align-items:center;gap:10px;
  color:#F7F1E4;padding:14px 4px;font-size:13.5px}
.bar .back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-weight:500;opacity:.85}
.bar .back:hover{opacity:1}
.bar a.ph{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.02em;color:var(--gold);text-decoration:none;white-space:nowrap}

.card{width:100%;max-width:520px;background:#FDFBF6;border-radius:20px;
  box-shadow:0 28px 70px -28px rgba(0,0,0,.65);padding:24px 20px 22px;margin-top:4px}
h1{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(22px,5.6vw,26px);line-height:1.4}
.sub{margin:3px 0 0;font-size:13.5px;color:var(--soil-60)}

form{margin-top:16px}
.field{margin-bottom:12px}
label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
label small{font-weight:500;color:var(--soil-40)}
input{width:100%;padding:13px 14px;font:inherit;font-size:16px;color:var(--soil);
  background:#fff;border:1.5px solid var(--husk-deep);border-radius:12px;transition:border-color .15s ease}
input:focus{border-color:var(--gram)}
input::placeholder{color:var(--soil-40)}
.honey{position:absolute;left:-6000px;top:auto;width:1px;height:1px;overflow:hidden}

.send{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:4px;padding:14px 16px;
  border:0;border-radius:14px;background:linear-gradient(135deg,#E2A536 0%,#B07A1E 100%);color:var(--soil);
  font-family:var(--display);font-weight:600;font-size:17px;line-height:1.3;cursor:pointer;
  box-shadow:0 12px 26px -12px rgba(176,122,30,.9);transition:transform .15s ease}
.send:hover{transform:translateY(-1px)}
.send:active{transform:none}
.send[disabled]{opacity:.6;cursor:wait;transform:none}
.fine{margin:10px 2px 0;font-size:11px;line-height:1.5;color:var(--soil-40)}

.alt{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.row{display:flex;gap:8px}
.row a{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:11px 8px;border-radius:12px;
  text-decoration:none;font-family:var(--display);font-weight:600;font-size:14px;transition:filter .15s ease}
.row a:hover{filter:brightness(1.12)}
.row a svg{width:19px;height:19px;flex:none}
.row .call{background:var(--soil);color:var(--husk)}
.row .wa{background:var(--wa);color:#fff}

.done{display:none;text-align:center;padding:16px 4px 8px}
.done .tick{width:62px;height:62px;margin:0 auto 12px;border-radius:50%;background:var(--soy);display:grid;place-items:center}
.done .tick svg{width:32px;height:32px;color:#fff}
.done h2{margin:0;font-family:var(--display);font-weight:700;font-size:23px}
.done p{margin:6px 0 0;font-size:14.5px;color:var(--soil-60)}
body.sent form,body.sent .sub{display:none}
body.sent .done{display:block}

@media (min-width:600px){
  .card{padding:32px 34px 28px}
  .bar{padding:22px 8px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="bar">
  <a class="back" href="../">&larr; वापस</a>
  <a class="ph" href="tel:+919713193706">97131 93706</a>
</div>

<div class="card">
  <h1>पूछताछ करें</h1>
  <p class="sub">मालिक खुद आपसे संपर्क करेंगे।</p>

  <div class="done" id="done">
    <div class="tick" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>
    </div>
    <h2>धन्यवाद!</h2>
    <p>आपकी जानकारी मिल गई है।<br>मालिक जल्द ही संपर्क करेंगे।</p>
  </div>

  <form action="https://formsubmit.co/trivedichitransh12@gmail.com" method="POST" id="enq">
    <input type="hidden" name="_subject" value="नलखेड़ा ज़मीन — नई पूछताछ">
    <input type="hidden" name="_template" value="table">
    <input type="hidden" name="_captcha" value="false">
    <input type="hidden" name="_next" value="https://trivedichitransh12-sys.github.io/nalkhedaland/enquiry/?sent=1" id="next">
    <input type="text" name="_honey" class="honey" tabindex="-1" autocomplete="off" aria-hidden="true">

    <div class="field">
      <label for="f-name">नाम</label>
      <input type="text" id="f-name" name="name" required autocomplete="name" placeholder="आपका नाम">
    </div>
    <div class="field">
      <label for="f-phone">मोबाइल नंबर</label>
      <input type="tel" id="f-phone" name="phone" required inputmode="tel" autocomplete="tel" minlength="10" pattern="[0-9+\- ]{10,15}" placeholder="10 अंकों का नंबर">
    </div>
    <div class="field">
      <label for="f-email">ईमेल <small>(वैकल्पिक)</small></label>
      <input type="email" id="f-email" name="email" autocomplete="email" placeholder="aapka@email.com">
    </div>
    <div class="field">
      <label for="f-from">आप कहाँ से हैं?</label>
      <input type="text" id="f-from" name="from" required placeholder="गाँव / शहर, ज़िला">
    </div>

    <button class="send" type="submit" id="sendbtn">भेजें <span aria-hidden="true">&rarr;</span></button>
    <p class="fine">आपकी जानकारी सिर्फ़ मालिक तक जाएगी।</p>
  </form>

  <div class="alt">
    <div class="row">
      <a class="call" href="tel:+919713193706">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
        कॉल करें
      </a>
      <a class="wa" href="https://wa.me/919713193706?text=%E0%A4%A8%E0%A4%AE%E0%A4%B8%E0%A5%8D%E0%A4%A4%E0%A5%87" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.2a9.8 9.8 0 0 0-8.4 14.8L2.3 21.7l4.9-1.3A9.8 9.8 0 1 0 12 2.2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path fill="currentColor" d="M9.2 7.6c.2-.4.5-.5.8-.5h.4c.2 0 .4.1.5.4l.8 1.9c.1.2 0 .5-.1.6l-.6.7c-.1.2-.1.3 0 .5.7 1.2 1.6 2.1 2.9 2.8.2.1.4.1.5 0l.7-.7c.2-.2.4-.2.6-.1l1.9.9c.2.1.4.3.4.5v.5c0 .4-.2.7-.5.9-.6.4-1.3.6-2 .5-3-.5-5.6-3.1-6.3-6.1-.1-.6.1-1.3.4-1.8z"/></svg>
        WhatsApp
      </a>
    </div>
  </div>
</div>

<script>
(function(){
  var next=document.getElementById('next');
  if(next && location.protocol.indexOf('http')===0){
    next.value=location.origin+location.pathname+'?sent=1';
  }
  if(/[?&]sent=1/.test(location.search)){
    document.body.classList.add('sent');
    if(typeof gtag==='function') gtag('event','enquiry_submitted');
  }
  var form=document.getElementById('enq'),btn=document.getElementById('sendbtn');
  if(form&&btn){form.addEventListener('submit',function(){btn.disabled=true;});}
})();
</script>

</body>
</html>
